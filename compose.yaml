services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bear_app
      POSTGRES_PASSWORD: bear_app
      POSTGRES_DB: bear_app
    ports:
      - '5432:5432'
    volumes:
      - bear_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bear_app -d bear_app']
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://bear_app:bear_app@db:5432/bear_app
      CORS_ORIGINS: http://localhost:5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:5173'
    environment:
      API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  bear_pgdata: